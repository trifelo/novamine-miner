<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovaMine Miner</title>

  <link rel="stylesheet" href="style.css">

  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div class="app">

    <div class="logo">
      ⛏️
    </div>

    <h1>NovaMine</h1>

    <p class="subtitle">
      Virtual Mining & Rewards
    </p>

    <div class="card">

      <p class="welcome">
        Halo, <span id="username">Miner</span> 👋
      </p>

      <div class="balance-box">

        <span class="balance-label">
          Saldo NVM
        </span>

        <h2>
          <span id="balance">0</span> NVM
        </h2>

      </div>

      <button id="openButton">
        🚀 Mulai NovaMine
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
